# Parámetros del modelo de inventario.
# Se edita a mano, solo por quien mantiene el sistema. Roberto no necesita tocar este archivo.
# Solo van aquí las decisiones que pueden cambiar. Los valores fijos de la memoria (ventana de 21 meses, cortes ADI y CV²,
# frecuencias de conteo, días de consignación) son constantes en inventario/config.py. Los costos, el tipo de cambio y el
# costo de cada envío viven en la planilla privada.

# Nivel de servicio: CRITERIO de la memoria (sección 4.2.5), no resultado de una optimización, porque el costo del quiebre
# no puede estimarse con el registro. Es el percentil de la distribución de Poisson con que se calcula el nivel objetivo S.
nivel_servicio: 0.95

# α de SBA: SUPUESTO ABIERTO, dentro del rango 0,05 a 0,20 evaluado por Syntetos, Boylan y Croston (2005) (memoria, 4.1.4).
alfa_suavizado: 0.15

# Embarques por origen (memoria, sección 4.2.5). Todo origen distinto de Argentina se trata como España.
# intervalo_embarque_meses (T): del análisis de tamaño de lote por embarque, con una tasa de costo de capital de 15 % anual
#   (rango de 10 % a 20 %). Si esa tasa cambia, T se recalcula fuera del código y se anota aquí.
# plazo_dias (L): plazo de reposición de la casa de origen (la memoria indica 5 a 7 días).
# minimo_embarque_usd: mínimo económico del embarque, a costo FOB.
origenes:
  - nombre: España
    intervalo_embarque_meses: 8.5
    plazo_dias: 7
    minimo_embarque_usd: 700
  - nombre: Argentina
    intervalo_embarque_meses: 12
    plazo_dias: 5.5
    minimo_embarque_usd: 700
