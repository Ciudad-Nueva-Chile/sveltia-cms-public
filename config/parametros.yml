# Parámetros del modelo de inventario. Se editan desde /admin (Sveltia CMS → Modelo de inventario).
# Siguen la memoria del proyecto (sección 4.2.5). Aquí solo van valores que no son sensibles: los factores de costo,
# el tipo de cambio y el costo de cada envío viven en la planilla privada.

historia_meses: 21            # ventana de observación de la memoria (diciembre de 2024 a agosto de 2026)

# Indicadores informativos de Syntetos, Boylan y Croston (2005). La clase de demanda se decide por meses con venta.
corte_adi: 1.32
corte_cv2: 0.49

alfa_suavizado: 0.15          # SUPUESTO ABIERTO: parámetro de SBA, dentro del rango 0,05 a 0,20 de la literatura
nivel_servicio: 0.95          # CRITERIO, no optimización: el costo del quiebre no puede estimarse con el registro

dias_consignacion_antigua: 365

# Conteo cíclico por categoría (estructura de Flores y Whybark, 1987, con frecuencias de la memoria)
conteos_por_anio: { AA: 12, BB: 2, CC: 1, DD: 1 }
revision_clasificacion_meses: { AA: 6, BB: 6, CC: 12, DD: 12 }

# Embarques por origen. Todo origen distinto de Argentina se trata como España.
# intervalo_embarque_meses (T): salió del análisis de tamaño de lote por embarque de la memoria, con una tasa de costo de
# capital de 15 % anual (rango de 10 % a 20 %). Si esa tasa cambia, T se recalcula fuera del código y se anota aquí.
# plazo_dias (L): plazo de reposición de la casa de origen (5 a 7 días).
origenes:
  - nombre: España
    intervalo_embarque_meses: 8.5
    plazo_dias: 7
    minimo_embarque_usd: 700
  - nombre: Argentina
    intervalo_embarque_meses: 12
    plazo_dias: 5.5
    minimo_embarque_usd: 700
