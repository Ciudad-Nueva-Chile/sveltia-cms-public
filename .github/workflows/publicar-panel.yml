# Publica en GitHub Pages el panel con DATOS DE EJEMPLO y el panel de parámetros (/admin).
# Nunca publica datos reales: el cálculo con la planilla privada es otro flujo (calculo-semanal.yml).
name: Publicar panel de demostración

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -R panel/. _site/
          python -m inventario --fuente ejemplo --panel _site/datos.json > /dev/null
          npm run admin
          cp -R admin _site/admin
          cp -R config _site/config
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
