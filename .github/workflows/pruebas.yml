name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: El modelo corre de punta a punta con los datos de ejemplo
        run: python -m inventario --panel /tmp/datos.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: El sitio se compila igual que en la publicación (con prefijo de GitHub Pages)
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npx eleventy --quiet --output=/tmp/sitio
