name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: El modelo corre de punta a punta con los datos de ejemplo
        run: python -m inventario --panel /tmp/datos.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ayudas de Sveltia (precio de lista ↔ neto, título y autor por ISBN)
        run: node --test tests/ayudas_admin.test.mjs
      - name: El sitio se compila igual que en la publicación (con prefijo de GitHub Pages)
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npx eleventy --quiet --output=/tmp/sitio
      - name: El mapa del sitio trae todas las categorías y cada ficha tiene su propia descripción
        run: |
          python - <<'PY'
          import pathlib, re, sys
          sitio = pathlib.Path("/tmp/sitio")
          mapa = (sitio / "sitemap.xml").read_text(encoding="utf-8")
          en_mapa = len(re.findall(r"/categoria/[^<]+/</loc>", mapa))
          paginas = len(list((sitio / "categoria").glob("*/index.html")))
          fichas = list((sitio / "catalogo").glob("*/index.html"))
          desc = [re.search(r'<meta name="description" content="([^"]*)"', f.read_text(encoding="utf-8")).group(1) for f in fichas]
          repetidas = len(desc) - len(set(desc))
          fuera = [u for u in ("/solicitud/", "/404") if u in mapa]
          print(f"URLs en el mapa: {mapa.count('<url>')} · categorías en el mapa: {en_mapa} de {paginas} · fichas: {len(fichas)} · descripciones repetidas: {repetidas}")
          errores = []
          if en_mapa != paginas or en_mapa < 16:
              errores.append(f"el mapa trae {en_mapa} categorías y hay {paginas} páginas de categoría (la memoria espera 16)")
          if repetidas:
              errores.append(f"{repetidas} fichas repiten la descripción de otra")
          if fuera:
              errores.append(f"el mapa no debe incluir {fuera}")
          if "fonts.googleapis.com" in (sitio / "index.html").read_text(encoding="utf-8"):
              errores.append("el sitio sigue cargando tipografías desde un servicio externo")
          if errores:
              sys.exit("Error: " + "; ".join(errores))
          PY
      - name: Disponibilidad en el sitio, solo estado y nunca cantidades
        run: |
          # Sin datos de la planilla el sitio no muestra estado (la compilación anterior no tenía disponibilidad.json)
          ! grep -rl --include=*.html -e 'estado-disponibilidad' -e 'tarjeta-estado' -e 'schema.org/InStock' /tmp/sitio
          # Con datos (de ejemplo) muestra solo la etiqueta
          python -m inventario --disponibilidad src/_data/disponibilidad.json > /dev/null
          npx eleventy --quiet --output=/tmp/sitio-disp
          python - <<'PY'
          import json, pathlib, re, sys
          datos = json.loads(pathlib.Path("src/_data/disponibilidad.json").read_text(encoding="utf-8"))
          errores = []
          for id_, d in datos["libros"].items():
              if set(d) - {"estado", "llega"} or d["estado"] not in ("disponible", "agotado", "bajo_pedido") or not isinstance(d.get("llega", False), bool):
                  errores.append(f"{id_}: el archivo de disponibilidad trae algo más que el estado: {d}")
          etiquetas = set()
          for f in pathlib.Path("/tmp/sitio-disp").rglob("*.html"):
              html = f.read_text(encoding="utf-8")
              etiquetas |= set(re.findall(r'class="estado-disponibilidad">([^<]*)<', html))
              if re.search(r"categoria_gestion|\b(En bodega|en bodega)\b|\bbodega\b", html):
                  errores.append(f"{f}: el HTML público menciona existencias")
          if not etiquetas or not etiquetas <= {"Disponible", "Agotado", "Bajo pedido"}:
              errores.append(f"Etiquetas inesperadas: {etiquetas}")
          print("Etiquetas en el sitio:", sorted(etiquetas))
          if errores:
              sys.exit("Error: " + "; ".join(errores[:5]))
          PY
