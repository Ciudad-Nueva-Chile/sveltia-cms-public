# Publica en GitHub Pages:
#   /            el sitio (no indexable en buscadores mientras sea de prueba)
#   /admin/      Sveltia CMS: libros, páginas, ajustes y parámetros del inventario
#   /inventario/ el panel de inventario
#
# Corre con cada cambio en main, cada hora de lunes a sábado en horario de oficina y todos los días temprano. En cada
# pasada también hace el cálculo del
# inventario con la planilla privada (detecta cambios, descuenta ventas, escribe los resultados en la planilla).
#
# El repositorio y el sitio son públicos, así que los datos reales del panel se publican CIFRADOS con la contraseña
# CLAVE_PANEL (el panel la pide). Sin los secretos de la planilla, o sin CLAVE_PANEL, el panel muestra datos de ejemplo.
# Los registros de Actions también son públicos: el cálculo no imprime datos.
name: Publicar sitio y panel

on:
  push:
    branches: [main]
  schedule:
    # Horas en UTC. Chile está 3 horas atrás en verano y 4 en invierno.
    - cron: "0 10 * * *"       # todos los días: 07:00 en verano (06:00 en invierno)
    - cron: "0 11-23 * * 1-6"  # lunes a sábado, cada hora: 08:00 a 20:00 en verano (07:00 a 19:00 en invierno)
  workflow_dispatch:

permissions:
  contents: write   # para guardar los libros completados por ISBN (paso «Completar por ISBN»)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Disponibilidad en el sitio («Disponible», «Agotado», «Bajo pedido»): DESACTIVADA. Con "no", el sitio no muestra estado y
# cada ficha ofrece consultar la disponibilidad (texto preliminar). Para activarla, cambiar a "si".
env:
  MOSTRAR_DISPONIBILIDAD: "no"

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Revisar el catálogo (duplicados) y completar por ISBN los libros nuevos (título, autor, portada, edición, sinopsis)
        # Marca con «aviso» los libros con el mismo ISBN, o el mismo título y edición, que otro (se ven en Sveltia con
        # «⚠ REVISAR»). Completa solo libros agregados en Sveltia que no se buscaron antes (herramientas/completar_libros.py). Busca en los sitios
        # de Ciudad Nueva España y Argentina y en Open Library, y guarda lo encontrado en el repositorio: sale publicado
        # en esta misma pasada. Un guardado hecho por Actions no vuelve a disparar la publicación.
        continue-on-error: true
        run: |
          python herramientas/completar_libros.py
          if [ -n "$(git status --porcelain src/libros src/assets/portadas herramientas/indice_ciudadnueva.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/libros src/assets/portadas herramientas/indice_ciudadnueva.json
            git commit -q -m "Revisa el catálogo y completa por ISBN libros nuevos"
            git pull -q --rebase && git push -q
          fi
      - name: Cálculo con la planilla, datos del panel y disponibilidad del sitio
        # Va antes de compilar el sitio: deja src/_data/disponibilidad.json (solo el estado de cada libro, sin cantidades)
        # para que las fichas muestren «Disponible», «Agotado» o «Bajo pedido». Si Google falla o no hay planilla, el
        # archivo no existe y el sitio se publica sin estado; el panel avisa que no encontró los datos.
        continue-on-error: true
        env:
          GOOGLE_CREDENCIALES: ${{ secrets.GOOGLE_CREDENCIALES }}
          ID_PLANILLA: ${{ secrets.ID_PLANILLA }}
          CLAVE_PANEL: ${{ secrets.CLAVE_PANEL }}
          PANEL: ${{ runner.temp }}/panel
        run: |
          mkdir -p "$PANEL"
          DISP=""
          if [ "$MOSTRAR_DISPONIBILIDAD" = "si" ]; then DISP="--disponibilidad src/_data/disponibilidad.json"; fi
          if [ -z "$GOOGLE_CREDENCIALES" ] || [ -z "$ID_PLANILLA" ]; then
            echo "::notice::Sin los secretos de la planilla: el panel muestra datos de ejemplo y el sitio no muestra disponibilidad."
            python -m inventario --fuente ejemplo --panel "$PANEL/datos.json" > /dev/null
          elif [ -z "$CLAVE_PANEL" ]; then
            python -m inventario --fuente sheets $DISP
            echo "::notice::Falta el secreto CLAVE_PANEL: el panel muestra datos de ejemplo, no los de la planilla."
            python -m inventario --fuente ejemplo --panel "$PANEL/datos.json" > /dev/null
          else
            python -m inventario --fuente sheets $DISP --panel "$PANEL/datos.cifrado.json" --cifrar
          fi
      - name: Sitio y panel de administración
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Panel de inventario (archivos y datos)
        env:
          PANEL: ${{ runner.temp }}/panel
        run: |
          mkdir -p _site/inventario
          cp -R panel/. _site/inventario/
          rm -f _site/inventario/datos.json _site/inventario/datos.cifrado.json
          cp "$PANEL"/datos*.json _site/inventario/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
