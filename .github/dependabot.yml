# Propone actualizaciones una vez al mes. Cada propuesta pasa por las pruebas antes de aceptarla.
version: 2
updates:
  - package-ecosystem: npm        # Sveltia CMS
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
