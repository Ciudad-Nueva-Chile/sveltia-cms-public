# Sveltia CMS: un solo panel para el sitio y para los parámetros del inventario.
# Los movimientos, el stock y los costos NO van aquí: viven en la Google Sheet privada.
#
# Para probar sin iniciar sesión: abre /admin/ en Chrome o Edge y elige «Trabajar con un repositorio local».
# Para usarlo en línea hace falta el autenticador (OAuth App de GitHub + sveltia-cms-auth en Cloudflare
# Workers) y poner su dirección en base_url. Ver docs/CONFIGURAR.md.

backend:
  name: github
  repo: Ciudad-Nueva-Chile/sveltia-cms-public
  branch: main
  base_url: REEMPLAZAR-worker-url
  commit_messages:
    create: "Agrega «{{slug}}»"
    update: "Actualiza «{{slug}}»"
    delete: "Elimina «{{slug}}»"
    uploadMedia: "Sube imagen «{{path}}»"
    deleteMedia: "Elimina imagen «{{path}}»"

site_url: https://ciudad-nueva-chile.github.io/sveltia-cms-public/
display_url: https://ciudad-nueva-chile.github.io/sveltia-cms-public/
logo_url: ../assets/img/marca/isotipo-rojo.png

media_folder: "src/assets/portadas"
public_folder: "/assets/portadas"

collections:
  # ---------------------------------------------------------------- Libros
  - name: libros
    label: Libros del catálogo
    label_singular: Libro
    description: "Cada libro es una ficha. Para destacarlo en la portada del sitio, marca «Destacar en la portada»."
    folder: src/libros
    format: yaml-frontmatter
    create: true
    slug: "{{fields.isbn}}"
    identifier_field: titulo
    summary: "{{oculto | ternary('🚫 OCULTO · ', '')}}{{titulo}} — {{autor}} · ${{precio_iva}}"
    sortable_fields: [titulo, autor, categoria, precio_iva]
    view_filters:
      - { label: "Destacados en la portada", field: destacado, pattern: true }
      - { label: "Ocultos en el sitio", field: oculto, pattern: true }
      - { label: "Sin portada", field: portada, pattern: "^$" }
      - { label: "Patrística", field: categoria, pattern: "^Patrística" }
    view_groups:
      - { label: Categoría, field: categoria }
      - { label: Colección, field: coleccion }
    fields:
      - { name: isbn, label: "ISBN", widget: string, pattern: ['^\d{9}[\dXx]$|^\d{13}$', "Debe tener 10 o 13 dígitos, sin guiones"], hint: "Escríbelo primero. Si dejas vacíos el título o el autor, al guardar se buscan por ISBN en Google Books y Open Library. Lo que siga faltando (también la portada y la edición) se busca minutos después en los sitios de Ciudad Nueva, al publicar. Revisa el resultado." }
      - { name: titulo, label: "Título", widget: string, required: false, hint: "Tal como aparece en la lista de precios. Vacío: se completa por ISBN al guardar. Si termina en una sigla como (BP. 46), el sitio la muestra como insignia." }
      - { name: autor, label: "Autor", widget: string, required: false, hint: "Vacío: se completa por ISBN al guardar. Para obras colectivas escribe «Aa.Vv.»; el sitio muestra «Varios autores»." }
      - { name: portada, label: "Portada", widget: image, required: false, hint: "Foto o imagen de la tapa, vertical. Si no hay, el sitio genera una portada con el título." }
      - { name: precio_iva, label: "Precio de lista (CLP, con IVA)", widget: number, value_type: int, min: 0, required: false, hint: "Escribe este o el neto: al guardar, el otro se calcula solo (IVA de 19 %). Si lo dejas en 0 el sitio muestra «Precio a consultar»." }
      - { name: precio_neto, label: "Precio neto (CLP, sin IVA)", widget: number, value_type: int, min: 0, required: false, hint: "Escribe este o el de lista: al guardar, el otro se calcula solo. Si cambias los dos, manda el de lista." }
      - { name: precio_iva_guardado, widget: hidden, required: false }
      - { name: precio_neto_guardado, widget: hidden, required: false }
      - { name: busqueda_isbn, widget: hidden, required: false }
      - name: categoria
        label: "Categoría"
        widget: relation
        collection: ajustes
        file: categorias
        search_fields: ["lista.*.nombre"]
        value_field: "lista.*.nombre"
        display_fields: ["lista.*.nombre"]
      - { name: oculto, label: "Ocultar en el sitio", widget: boolean, default: false, required: false, hint: "Activado: el libro no aparece en ninguna parte del sitio (catálogo, búsqueda, portada) y su página deja de publicarse. Sigue en la planilla de inventario." }
      - { name: destacado, label: "Destacar en la portada", widget: boolean, default: false, required: false }
      - { name: origen_editorial, label: "Edición", widget: select, options: ["Ciudad Nueva España", "Ciudad Nueva Argentina", "Uruguay", "Otra"], required: false }
      - { name: coleccion, label: "Colección", widget: string, required: false, hint: "Solo para patrística: por ejemplo «Biblioteca de Patrística»." }
      - { name: num_coleccion, label: "N.º dentro de la colección", widget: string, required: false }
      - { name: subcategoria, label: "Subcategoría", widget: string, required: false }
      - { name: body, label: "Sobre el libro (sinopsis)", widget: markdown, required: false, hint: "Opcional. Si la escribes, aparece en la ficha bajo el título «Sobre el libro»." }
      - name: inventario_tipo
        label: "Inventario: tipo especial"
        widget: select
        required: false
        options: ["", "Estacional", "Coyuntural"]
        hint: "Estacional: calendarios y agendas (un pedido al año antes de septiembre). Coyuntural: un acontecimiento que no se repite, como la línea Carlo Acutis (se atiende por reacción). Ambos van a la categoría A. Vacío: la clase la decide el cálculo por meses con venta."
      - name: inventario_decision
        label: "Inventario: decisión manual"
        widget: select
        required: false
        options: ["", "Reponer", "Reponer lo vendido", "Temporada", "No reponer", "A pedido"]
        hint: "Solo si quieres pasar por encima de la política que asigna la categoría (A repone hasta S, B repone lo vendido, C y D no se reponen). Vacío: la decide el cálculo."
      - { name: estado_comercial, label: "Estado comercial — uso interno", widget: string, required: false }
      - { name: id_catalogo, label: "ID interno del catálogo", widget: string, required: false }

  # ---------------------------------------------------------------- Páginas
  - name: paginas
    label: Páginas del sitio
    description: "Textos de las páginas «Librerías e instituciones» y «Nosotros»."
    files:
      - name: instituciones
        label: Librerías e instituciones
        file: src/paginas/instituciones.md
        fields: &campos_pagina
          - { name: titulo, label: "Título", widget: string }
          - { name: titulo_menu, label: "Nombre en el menú", widget: string }
          - { name: antetitulo, label: "Antetítulo", widget: string, required: false }
          - { name: bajada, label: "Bajada", widget: text, required: false }
          - { name: body, label: "Contenido", widget: markdown }
      - name: nosotros
        label: Nosotros
        file: src/paginas/nosotros.md
        fields: *campos_pagina

  # ---------------------------------------------------------------- Ajustes
  - name: ajustes
    label: Ajustes del sitio
    description: "Contacto, textos de la portada, fecha de la lista de precios, categorías y colecciones."
    files:
      - name: sitio
        label: Contacto y portada
        file: src/_data/sitio.json
        fields:
          - { name: nombre, label: "Nombre del sitio", widget: string }
          - { name: nombre_pais, label: "País (bajo el nombre)", widget: string }
          - { name: url, label: "Dirección web", widget: string }
          - { name: descripcion, label: "Descripción para buscadores", widget: text }
          - { name: whatsapp, label: "WhatsApp (solo números, con 56)", widget: string, pattern: ['^56\d{9}$', "Ejemplo: 56912345678"] }
          - { name: email, label: "Correo de contacto", widget: string }
          - { name: ciudad, label: "Ciudad", widget: string }
          - { name: fecha_lista, label: "Fecha de vigencia de la lista de precios", widget: datetime, time_format: false, date_format: "DD-MM-YYYY", format: "YYYY-MM-DD", hint: "Actualízala cada vez que cambies precios: se muestra junto a cada precio." }
          - { name: aviso_prototipo, label: "Aviso al pie (dejar vacío al publicar en serio)", widget: string, required: false }
          - name: portada
            label: Portada (inicio)
            widget: object
            fields:
              - { name: antetitulo, label: "Antetítulo", widget: string }
              - { name: titulo, label: "Título grande", widget: string }
              - { name: bajada, label: "Bajada", widget: text }
          - name: anuncio
            label: Franja de anuncio (arriba de todo)
            widget: object
            fields:
              - { name: activo, label: "Mostrar", widget: boolean, default: false }
              - { name: texto, label: "Texto", widget: string, required: false }
              - { name: enlace, label: "Enlace (opcional)", widget: string, required: false }
      - name: categorias
        label: Categorías
        file: src/_data/categorias.json
        fields:
          - name: lista
            label: Categorías
            label_singular: Categoría
            widget: list
            summary: "{{fields.corto}}"
            hint: "El orden de esta lista es el orden en el sitio. Si cambias un «Nombre», cambia también la categoría de los libros que la usan."
            fields:
              - { name: nombre, label: "Nombre (el que usan los libros)", widget: string }
              - { name: corto, label: "Nombre corto (el que se ve)", widget: string }
              - { name: descripcion, label: "Descripción", widget: string, required: false }
              - { name: color, label: "Color", widget: color }
      - name: colecciones
        label: Colecciones de patrística
        file: src/_data/colecciones.json
        fields:
          - name: lista
            label: Colecciones
            label_singular: Colección
            widget: list
            summary: "{{fields.sigla}} · {{fields.nombre}}"
            fields:
              - { name: nombre, label: "Nombre (igual al campo «Colección» de los libros)", widget: string }
              - { name: sigla, label: "Sigla", widget: string }
              - { name: descripcion, label: "Descripción", widget: text }

  # ---------------------------------------------------------------- Inventario
